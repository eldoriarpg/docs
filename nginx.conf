server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    include /etc/nginx/redirects.conf;

    location / {
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
